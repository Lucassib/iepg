# Fly.io configuration (https://fly.io/docs/reference/configuration/). The app name is global on Fly.io:
# change it before the first `fly launch` if it is taken.
app = "iepg"
primary_region = "iad"   # Ashburn, the cheapest region; São Paulo (gru) costs about 60% more

[build]
  dockerfile = "Dockerfile"

[env]
  IEPG_ENV = "production"
  IEPG_CLIENT_IP_HEADER = "Fly-Client-IP"

[deploy]
  strategy = "bluegreen"   # the new machine must pass the health check before it takes the traffic

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
